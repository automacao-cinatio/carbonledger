name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest # traz Docker, necessario para o testcontainers
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync

      - name: Navegador dos testes de acessibilidade (axe-core via Playwright)
        run: uv run playwright install --with-deps chromium

      - name: make check
        run: make check
