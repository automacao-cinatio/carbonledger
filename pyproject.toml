[project]
name = "carbonledger"
version = "0.1.0"
description = "Plataforma da CINATIO para inventario de emissoes de GEE"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "httpx>=0.28",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "pint>=0.24",
    "lxml>=5.3",
    "defusedxml>=0.7",
    "xmlschema>=3.4",
    "playwright>=1.48",
    "pyhanko>=0.25",
    "anthropic>=0.40",
    "joserfc>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.120",
    "testcontainers>=4.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true

# Modo estrito apenas em app/core e app/modules/calculo, conforme o P01.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.modules.calculo.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: usa Postgres real via testcontainers (exige Docker)",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
