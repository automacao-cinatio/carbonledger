# Ensaio de producao: pela rede, so TLS com senha (scram); sem TLS, recusado.
# O socket local (dentro do container) fica para o initdb, o healthcheck e o backup.
local     all  all                 trust
hostssl   all  all  0.0.0.0/0      scram-sha-256
hostssl   all  all  ::/0           scram-sha-256
hostnossl all  all  0.0.0.0/0      reject
hostnossl all  all  ::/0           reject
